# One-second, expected-INVALID all-phase semantic workload for native 3FS on giga.
# The runner replaces only datadir, resultdir, and the three find nproc values.

[global]
datadir = /will/be/replaced/by-native-runner
timestamp-datadir = FALSE
resultdir = /will/be/replaced-by-native-runner
timestamp-resultdir = FALSE
api = POSIX
drop-caches = FALSE
verbosity = 1
scc = TRUE
dataPacketType = timestamp

[debug]
stonewall-time = 1
pause-dir =

[ior-easy]
API = POSIX
transferSize = 1m
blockSize = 64m
filePerProc = TRUE
uniqueDir = FALSE
run = TRUE

[ior-easy-write]
API = POSIX
run = TRUE

[ior-rnd4K]
API = POSIX
blockSize = 67108864
run = TRUE
randomPrefill = 0

[ior-rnd4K-write]
API = POSIX
run = TRUE

[mdtest-easy]
API = POSIX
n = 64
run = TRUE

[mdtest-easy-write]
API = POSIX
run = TRUE

[ior-rnd1MB]
API = POSIX
blockSize = 67108864
run = TRUE
randomPrefill = 0

[ior-rnd1MB-write]
API = POSIX
run = TRUE

[mdworkbench]
API = POSIX
waitingTime = 0.0
precreatePerSet = 2
filesPerProc = 2
run = TRUE

[mdworkbench-create]
run = TRUE

[find-easy]
nproc = 2
run = TRUE
pfind-queue-length = 10000
pfind-steal-next = FALSE
pfind-parallelize-single-dir-access-using-hashing = FALSE

[ior-hard]
API = POSIX
segmentCount = 256
run = TRUE

[ior-hard-write]
API = POSIX
run = TRUE

[mdtest-hard]
API = POSIX
n = 32
run = TRUE

[mdtest-hard-write]
API = POSIX
run = TRUE

[find]
nproc = 2
run = TRUE
pfind-queue-length = 10000
pfind-steal-next = FALSE
pfind-parallelize-single-dir-access-using-hashing = FALSE

[ior-rnd4K-read]
API = POSIX
run = TRUE

[ior-rnd1MB-read]
API = POSIX
run = TRUE

[find-hard]
nproc = 2
run = TRUE
pfind-queue-length = 10000
pfind-steal-next = FALSE
pfind-parallelize-single-dir-access-using-hashing = FALSE

[mdworkbench-bench]
run = TRUE

[ior-easy-read]
API = POSIX
run = TRUE

[mdtest-easy-stat]
API = POSIX
run = TRUE

[ior-hard-read]
API = POSIX
run = TRUE

[mdtest-hard-stat]
API = POSIX
run = TRUE

[mdworkbench-delete]
run = TRUE

[mdtest-easy-delete]
API = POSIX
run = TRUE

[mdtest-hard-read]
API = POSIX
run = TRUE

[mdtest-hard-delete]
API = POSIX
run = TRUE

[ior-rnd4K-easy-read]
API = POSIX
run = TRUE
