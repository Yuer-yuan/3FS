shuffle = true
subdirs = 4
files_per_dir = 10000
threads = 4
coroutines = 8
cluster_id = '${FS_CLUSTER}'

[meta_client]
network_type = 'CXL'
selection_mode = 'UniformRandom'

[mgmtd_client]
mgmtd_server_addresses = [ 'CXL://${ADDRESS}:${MGMTD_PORT}' ]

[net_client]
default_timeout = '1s'

[[monitor.reporters]]
type = 'log'
