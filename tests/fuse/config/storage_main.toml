[[common.log.categories]]
categories = [ '.' ]
handlers = [ 'normal' ]

[[common.log.handlers]]
async = true
name = 'normal'
start_level = 'NONE'
writer_type = 'FILE'
file_path = '${STORAGE_LOG}'

[[server.base.groups]]
[server.base.groups.listener]
listen_port = ${STORAGE_PORT}

[server.base.groups.io_worker.cxlsocket]
queue_depth = 8
cell_bytes = 65536

[[server.base.groups]]
[server.base.groups.listener]
listen_port = 0

[server.allocate_worker]
min_remain_groups = 0
max_remain_groups = 1
max_reserved_chunks = '1GB'

[server.mgmtd]
mgmtd_server_addresses = [ 'CXL://${ADDRESS}:${MGMTD_PORT}' ]

[server.targets]
target_paths = [ ${TARGETS} ]
allow_disk_without_uuid = true

[server.aio_read_worker]
enable_io_uring = false

[server.buffer_pool]
big_buffer_count = 1
big_buffer_size = '8MB'
buffer_count = 2
buffer_size = '4MB'

[server.client.io_worker.cxlsocket]
queue_depth = 8
cell_bytes = 65536

[server.forward_client.io_worker.cxlsocket]
queue_depth = 8
cell_bytes = 65536
