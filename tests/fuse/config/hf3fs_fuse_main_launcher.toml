allow_other = false
token_file = '${TOKEN_FILE}'
cluster_id = '${FS_CLUSTER}'

[cxl]
enabled = true
endpoint = 16
endpoint_generation = 1
manifest_path = '${CXL_MANIFEST}'
mode = 'Attach'
region_length = '256MB'
region_path = '${CXL_REGION}'
region_type = 'File'

[mgmtd_client]
mgmtd_server_addresses = [ 'CXL://${ADDRESS}:${MGMTD_PORT}' ]

[client.io_worker.cxlsocket]
queue_depth = 8
cell_bytes = 65536
